<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>Roundabout Circular Analyzer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<header>
<div class="controls">
<label for="query">Area:</label>
<input id="query" type="text" placeholder="Barcelona" autocomplete="off" aria-label="Area or relation ID">
<button id="run" type="button">Analyze</button>
<button id="settingsToggle" type="button" aria-controls="serverPanel" aria-expanded="false" title="Overpass server settings">Server</button>
<span id="status" role="status" aria-live="polite"></span>
</div>
<div id="serverPanel" class="server-panel" hidden>
<label for="serverUrl">Overpass server</label>
<input id="serverUrl" type="url" spellcheck="false" autocomplete="off" placeholder="https://overpass-api.de/api/">
<div class="server-actions">
<button id="serverReset" type="button">Reset to default</button>
<button id="serverSave" type="button">Save</button>
</div>
<p>Accepts URLs ending in /api/ or /interpreter. The URL is saved in this browser.</p>
</div>
</header>
<main class="main">
<aside class="side" aria-label="Analysis results">
<div id="stats" class="stats"></div>
<nav class="nav" aria-label="Result navigation">
<button id="prev" type="button" aria-label="Previous result">◀</button>
<button id="next" type="button" aria-label="Next result">▶</button>
<span id="counter">0/0</span>
<label class="nav-chk"><input type="checkbox" id="byCluster" checked>Cluster</label>
</nav>
<div id="list" role="list" aria-label="Ways in the selected category"></div>
</aside>
<section id="map" aria-label="OpenStreetMap map"></section>
</main>
<div id="popup" class="popup" hidden></div>
</body>
</html>
